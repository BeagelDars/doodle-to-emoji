<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Carter Clicker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖥️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="light-theme">
  <!-- Minimal Header -->
  <header class="app-header">
    <div class="brand">
      <span class="brand-badge">⚡</span>
      <h1 class="brand-title">Carter Clicker</h1>
    </div>
    <div class="header-right">
      <span id="carter-vibe-tag" class="vibe-pill">Mugshot</span>
      <button id="btn-reset" class="reset-link" title="Reset game">Reset</button>
    </div>
  </header>

  <!-- Main Game Layout -->
  <main class="game-container">
    <!-- LEFT: Clicker Stage -->
    <section class="stage">
      <!-- Roast speech bubble -->
      <div class="quote-bubble" id="carter-quote">
        "Don't you dare put thermal paste in the socket, bro."
      </div>

      <!-- Main Score -->
      <div class="score-display">
        <div class="coins-total">
          <span class="coin-icon">🪙</span>
          <span id="coin-count">0</span>
        </div>
        <div class="rate-sub">
          <span id="cps-display">0</span> / sec
        </div>
      </div>

      <!-- Clickable Carter -->
      <div class="carter-box" id="carter-click-area">
        <div class="click-ripple" id="click-ripple"></div>
        <img 
          id="carter-img" 
          src="images/carter1.png" 
          alt="Carter" 
          class="carter-img"
          draggable="false"
        >
        <!-- Floating click numbers and jokes -->
        <div id="click-effects" class="click-effects"></div>
      </div>

      <p class="click-hint">Click Carter to build PCs!</p>
    </section>

    <!-- RIGHT: Upgrades Shop -->
    <section class="shop">
      <div class="shop-header">
        <h2>Upgrades</h2>
        <span id="owned-count-badge" class="count-badge">0 owned</span>
      </div>

      <div id="shop-list" class="shop-list">
        <!-- Dynamically injected items -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
